<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bit &amp; o Núcleo de Cristal — Cruzadinha de Arquitetura Computacional</title>
  <meta name="description" content="Mini jogo de cruzadinha com história sobre Arquitetura Computacional: CPU, memórias, barramentos e núcleos.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/cruzadinha.css">
  <link rel="stylesheet" href="css/historia.css">
</head>
<body>

  <!-- ===== CENÁRIO DE FUNDO (céu, sol, nuvens, colinas) ===== -->
  <div id="cenario" aria-hidden="true">
    <div class="raios"></div>
    <div class="sol"></div>
    <div class="nuvem n1"></div>
    <div class="nuvem n2"></div>
    <div class="nuvem n3"></div>

    <svg class="swoosh" viewBox="0 0 1200 400" preserveAspectRatio="none">
      <defs>
        <linearGradient id="sw1" x1="0" x2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/>
          <stop offset=".5" stop-color="#fff" stop-opacity=".75"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="sw2" x1="0" x2="1">
          <stop offset="0" stop-color="#b8f0ff" stop-opacity="0"/>
          <stop offset=".6" stop-color="#e8fbff" stop-opacity=".6"/>
          <stop offset="1" stop-color="#b8f0ff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M0 260 C 300 120, 600 330, 1200 150 L1200 175 C 620 350, 300 150, 0 290 Z" fill="url(#sw1)"/>
      <path d="M0 300 C 350 200, 700 360, 1200 220 L1200 232 C 700 380, 350 220, 0 312 Z" fill="url(#sw2)"/>
    </svg>

    <svg class="ondas" viewBox="0 0 1440 420" preserveAspectRatio="none">
      <defs>
        <linearGradient id="colinaFundo" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#b8f28a"/>
          <stop offset="1" stop-color="#3fae4a"/>
        </linearGradient>
        <linearGradient id="colinaFrente" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#a6ec6c"/>
          <stop offset=".45" stop-color="#4cc24a"/>
          <stop offset="1" stop-color="#1c8a3a"/>
        </linearGradient>
        <linearGradient id="brilhoColina" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".7"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5fd4ff" stop-opacity=".85"/>
          <stop offset="1" stop-color="#0a83cf"/>
        </linearGradient>
      </defs>
      <path d="M0 210 C 220 120, 420 120, 640 190 C 860 260, 1080 110, 1440 170 L1440 420 L0 420 Z" fill="url(#colinaFundo)" opacity=".9"/>
      <path d="M0 270 C 260 170, 520 200, 760 250 C 1000 300, 1200 210, 1440 240 L1440 420 L0 420 Z" fill="url(#colinaFrente)"/>
      <path d="M40 262 C 280 180, 520 205, 740 250 C 560 222, 300 205, 40 280 Z" fill="url(#brilhoColina)"/>
      <path d="M0 360 C 360 335, 720 380, 1080 350 C 1260 335, 1360 345, 1440 350 L1440 420 L0 420 Z" fill="url(#agua)"/>
      <path d="M0 364 C 360 340, 720 384, 1080 354 C 720 372, 360 352, 0 372 Z" fill="#fff" opacity=".55"/>
    </svg>
  </div>

  <!-- bolhas clicáveis -->
  <div id="bolhas" aria-hidden="true"></div>

  <!-- ===== HUD ===== -->
  <header class="hud">
    <div class="hud-esquerda">
      <button id="btn-inicio" class="btn vidro-btn pequeno" hidden>⌂ Início</button>
    </div>
    <div class="hud-direita">
      <div id="hud-gotas" class="pilula vidro" title="Gotas de energia">
        <span id="hud-gotas-icone"></span>
        <span id="hud-gotas-valor" class="pixel">0</span>
      </div>
      <button id="btn-som" class="btn vidro-btn btn-icone" aria-label="Desligar som"></button>
    </div>
  </header>

  <!-- ===== TELAS ===== -->
  <main id="telas">

    <section id="tela-titulo" class="tela">
      <h1 class="logo">
        <span class="logo-topo">ARQUITETURA COMPUTACIONAL</span>
        <span class="logo-principal">Bit</span>
        <span class="logo-sub">&amp; o Núcleo de Cristal</span>
      </h1>

      <div class="palco-bit">
        <div class="bolha-bit"></div>
        <div class="sombra-bit"></div>
      </div>

      <nav class="menu-titulo">
        <button class="btn verde grande" data-acao="aventura">▶ <span>Começar aventura</span></button>
        <button class="btn" data-acao="cruzadinha">💎 Ir direto para a cruzadinha</button>
        <button class="btn vidro-btn" data-acao="como">? Como jogar</button>
      </nav>

      <p class="rodape-titulo vidro">Cruzadinha · Arquitetura Computacional · Sprint 3</p>
    </section>

  </main>

  <div id="modal"></div>
  <div id="toast" class="vidro" role="status" aria-live="polite"></div>

  <!-- ===== SCRIPTS ===== -->
  <script src="js/audio.js" defer></script>
  <script src="js/pixel.js" defer></script>
  <script src="script.js" defer></script>
  <script src="js/palavras.js" defer></script>
  <script src="js/cruzadinha.js" defer></script>
  <script src="js/perguntas.js" defer></script>
  <script src="js/historia.js" defer></script>
</body>
</html>
